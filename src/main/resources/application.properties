server.port=8082
# 1. NOM DE L'APPLICATION
spring.application.name=lab-manager

# 2. CONNEXION MYSQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/db_lias?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. HIBERNATE (Génération auto des tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 4. SÉCURITÉ (Login par défaut pour le projet)
spring.security.user.name=admin
spring.security.user.password=123

# 5. FIX ERREUR 413 : TAILLE DES FICHIERS (PDF/CV)
# On autorise jusqu'à 10 Mo par fichier
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 6. CHEMIN DE RÉCEPTION DES DOCUMENTS (Section 10)
# C'est ici que l'application va "déposer" les PDF sur ton disque dur
upload.path=uploads/

# 7. THYMELEAF (Désactiver le cache pour voir les modifs HTML sans redémarrer)
spring.thymeleaf.cache=false

# 8. INITIALISATION SQL (Section 10 - Archives)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true