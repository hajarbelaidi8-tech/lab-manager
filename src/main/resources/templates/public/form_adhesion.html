<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Postuler - LIAS Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .form-card { border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-primary { background-color: #059669; border: none; padding: 12px; font-weight: 600; }
        .btn-primary:hover { background-color: #047857; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark"><i class="fa-solid fa-flask-vial me-2 text-success"></i>LIAS <span style="color:#059669">Lab</span></h2>
                <p class="text-muted">Candidature au Laboratoire de Recherche</p>
            </div>
            
            <div class="card form-card p-4 bg-white">
                <div th:if="${param.success}" class="alert alert-success border-0 shadow-sm mb-4">
                    <i class="fa-solid fa-check-circle me-2"></i> Votre demande a été envoyée avec succès !
                </div>
                
                <form th:action="@{/postuler/save}" th:object="${demande}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom</label>
                        <input type="text" th:field="*{nom}" class="form-control" placeholder="Entrez votre nom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Prénom</label>
                        <input type="text" th:field="*{prenom}" class="form-control" placeholder="Entrez votre prénom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Adresse Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="exemple@mail.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Équipe Cible</label>
                        <select th:field="*{equipeCible}" class="form-select" required>
                            <option value="">Sélectionnez une équipe...</option>
                            <!-- Blindage contre les erreurs de variable nulle -->
                            <option th:each="e : ${equipes != null ? equipes : {}}" th:value="${e.id}" th:text="${e.nom}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Votre CV (PDF)</label>
                        <input type="file" name="cvFile" class="form-control" accept=".pdf" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Lettre de Motivation</label>
                        <textarea th:field="*{motivation}" class="form-control" rows="4" placeholder="Expliquez pourquoi vous souhaitez nous rejoindre..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3 shadow-sm">Envoyer ma candidature</button>
                    <div class="text-center">
                        <a href="/" class="text-muted small text-decoration-none">Retour à l'accueil</a>
                    </div>
                </form>
            </div>
            <p class="text-center mt-4 text-muted small">© 2026 Faculté des Sciences Ben M'Sik - Casablanca</p>
        </div>
    </div>
</div>
</body>
</html>
