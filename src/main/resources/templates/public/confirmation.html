<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation - LIAS Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 40px; text-align: center; max-width: 500px; }
        .icon-box { width: 80px; height: 80px; background-color: #059669; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
        .btn-home { background-color: #059669; border: none; padding: 12px 30px; font-weight: 600; color: white; text-decoration: none; border-radius: 8px; transition: 0.3s; }
        .btn-home:hover { background-color: #047857; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2 class="fw-bold mb-3">Merci pour votre message !</h2>
        <p class="text-muted mb-4">Votre demande d'adhésion a été transmise à la direction du laboratoire LIAS. Vous recevrez une réponse par email après étude de votre dossier.</p>
        <a href="/" class="btn-home">Retour à l'accueil</a>
    </div>
</body>
</html>
