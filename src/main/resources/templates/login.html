<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Connexion - LAB LIAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); height: 100vh; display: flex; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="login-card text-center">
        <h2 class="mb-4 text-primary fw-bold">🧪 LAB-LIAS</h2>
        <p class="text-muted">Connectez-vous à la plateforme</p>
        
        <!-- Affichage des erreurs -->
        <div th:if="${param.error}" class="alert alert-danger small py-2">
            <span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}" th:text="${session.SPRING_SECURITY_LAST_EXCEPTION.message}"></span>
            <span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION == null}">Email ou mot de passe incorrect</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Email (admin@univ.ma)" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Mot de passe (123)" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
        </form>
    </div>
</div>
</body>
</html>
