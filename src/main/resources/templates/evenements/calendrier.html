<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calendrier Scientifique - LIAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .timeline { position: relative; padding: 20px 0; }
        .timeline::before { content: ''; position: absolute; left: 50px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; }
        .timeline-item { position: relative; margin-bottom: 40px; padding-left: 100px; }
        .timeline-marker { position: absolute; left: 40px; width: 20px; height: 20px; border-radius: 50%; background: #059669; border: 4px solid white; box-shadow: 0 0 0 2px #059669; z-index: 1; }
        .timeline-content { background: white; padding: 20px; border-radius: 12px; shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; }
        .timeline-date { position: absolute; left: 0; width: 80px; text-align: right; font-weight: bold; color: #64748b; font-size: 0.8rem; top: 2px; }
    </style>
</head>
<body>
<div th:replace="~{layout/navbar :: menu}"></div>

<div class="main-content">
    <h3 class="fw-bold mb-4 text-dark"><i class="fa-solid fa-calendar-alt me-2 text-success"></i>Timeline des Activités</h3>

    <div class="timeline">
        <div class="timeline-item" th:each="e : ${evenements}">
            <div class="timeline-date" th:text="${#temporals.format(e.dateEvenement, 'dd MMM')}">Date</div>
            <div class="timeline-marker"></div>
            <div class="timeline-content">
                <span class="badge bg-light text-dark border mb-2" th:text="${e.type}">TYPE</span>
                <h5 class="fw-bold mb-1" th:text="${e.titre}">Titre</h5>
                <p class="small text-muted mb-0"><i class="fa-solid fa-location-dot me-1"></i> <span th:text="${e.lieu}">Lieu</span></p>
                <div class="mt-3">
                    <a th:href="@{'/evenements/details/' + ${e.id}}" class="btn btn-sm btn-link p-0 text-decoration-none fw-bold">Détails <i class="fa-solid fa-arrow-right ms-1"></i></a>
                </div>
            </div>
        </div>
        
        <div th:if="${evenements.isEmpty()}" class="text-center py-5">
            <p class="text-muted">Aucun événement planifié.</p>
        </div>
    </div>
</div>
</body>
</html>
