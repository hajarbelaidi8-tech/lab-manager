<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{layout/navbar :: menu}"></div>
<div class="main-content">
    <div class="card p-4 border-0 shadow">
        <h3>✏️ Modification Complète du Profil</h3>
        <form th:action="@{/membres/modifier}" th:object="${membre}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <div class="row">
                <div class="col-md-6 mb-3"><label class="fw-bold">Nom</label><input type="text" th:field="*{nom}" class="form-control"></div>
                <div class="col-md-6 mb-3"><label class="fw-bold">Prénom</label><input type="text" th:field="*{prenom}" class="form-control"></div>
                <div class="col-md-6 mb-3"><label class="fw-bold">Établissement d'origine</label><input type="text" th:field="*{etablissementOrigine}" class="form-control"></div>
                <div class="col-md-6 mb-3"><label class="fw-bold">Laboratoire d'origine</label><input type="text" th:field="*{laboratoireOrigine}" class="form-control"></div>

                <!-- ⭐ NOUVEAU : DATE DE NAISSANCE (Match Section 4.2 PDF) -->
                <div class="col-md-6 mb-3">
                    <label class="fw-bold"><i class="fa-solid fa-cake-candles me-2 text-danger"></i>Date de Naissance</label>
                    <input type="date" th:field="*{dateNaissance}" class="form-control">
                    <small class="text-muted">Information confidentielle</small>
                </div>

                <div class="col-md-6 mb-3"><label class="fw-bold">Changer la Photo</label><input type="file" name="image" class="form-control"></div>

                <!-- 1. BLOC STATUT: Ay wa7ed iqder i-beddel l-statut dyalo (Match Section 3) -->
                <!-- MATCH SECTION 3 & 8.1 : L-KHANA D L-STATUT L-DAKIYA -->
                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Statut</label>

                    <!-- A. ILA KAN RETRAITE (Match Section 8.1): Khana m-ssouda b l-9fel -->
                    <div th:if="${membre.statut == T(ma.fsm.lab_manager.entities.StatutMembre).RETRAITE}">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-danger text-danger"><i class="fa-solid fa-lock"></i></span>
                            <input type="text" value="RETRAITE (Compte gelé)" class="form-control bg-light text-danger fw-bold border-danger" readonly>
                        </div>
                        <!-- Darori n-khbiw l-valeur bach Java ma-t- Match-i-ch Null -->
                        <input type="hidden" th:field="*{statut}">
                        <small class="text-danger">Ce statut est définitif pour la mémoire institutionnelle.</small>
                    </div>

                    <!-- B. SINON (Match Section 3): Ikhtiyar  (Permanent, Doctorant, Ancien) -->
                    <select th:unless="${membre.statut == T(ma.fsm.lab_manager.entities.StatutMembre).RETRAITE}"
                            th:field="*{statut}" class="form-select border-primary shadow-sm">
                        <option th:each="s : ${tousLesStatuts}" th:value="${s}" th:text="${s}"></option>
                    </select>
                    <small th:unless="${membre.statut == T(ma.fsm.lab_manager.entities.StatutMembre).RETRAITE}" class="text-muted">
                        Vous pouvez évoluer vers un autre statut (ex: Doctorant vers Permanent).
                    </small>
                </div>

                <!-- 2. BLOC RÔLE: (Section 5.2 - Seul le Directeur modifie) -->

                <!-- 2. BLOC RÔLE -->
                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Rôle (Responsabilité)</label>

                    <!-- Le directeur peut modifier le rôle -->
                    <select th:field="*{role}"
                            class="form-select border-primary"
                            sec:authorize="hasRole('DIRECTEUR') or hasRole('VICE_DIRECTEUR')">
                        <option th:each="r : ${tousLesRoles}"
                                th:value="${r}"
                                th:text="${r}">
                        </option>
                    </select>

                    <!-- Les autres utilisateurs voient le rôle sans le modifier -->
                    <div sec:authorize="!hasRole('DIRECTEUR')">
                        <input type="text"
                               th:value="${membre.role}"
                               class="form-control bg-light"
                               readonly>
                        <!-- Keep the current value for submission -->
                        <input type="hidden" th:field="*{role}">
                    </div>
                </div>

                <div class="col-12 mb-3"><label class="fw-bold">Centres d'intérêt</label><input type="text" th:field="*{centresInteret}" class="form-control" placeholder="IA, Big Data, Cloud..."></div>
                <div class="col-12 mb-3"><label class="fw-bold">Biographie</label><textarea th:field="*{biographie}" class="form-control" rows="4"></textarea></div>
                <!-- ⭐ NOUVEAU : CHANGEMENT DE MOT DE PASSE ⭐ -->
                <div class="col-md-6 mb-3">
                    <label class="fw-bold text-danger"><i class="fa-solid fa-key me-2"></i>Nouveau Mot de Passe</label>
                    <input type="password" name="nouveauPassword" class="form-control" placeholder="Laissez vide pour ne pas changer">
                    <small class="text-muted">Si vous remplissez ce champ, votre ancien mot de passe sera écrasé.</small>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary px-5 rounded-pill shadow">Mettre à jour le profil</button>
                <a href="/profil" class="btn btn-light px-5 rounded-pill border ms-2">Annuler</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
