<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Paramètres Labo - LIAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/navbar :: menu}"></div>

<div class="main-content">
    <div class="card p-4 border-0 shadow-sm bg-white">
        <h3 class="fw-bold mb-4"><i class="fa-solid fa-gears me-2 text-primary"></i>Paramètres du Laboratoire</h3>
        
        <form th:action="@{/admin/settings/save}" method="post">
            <input type="hidden" name="id" th:value="${labo?.id}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Nom du Laboratoire</label>
                    <input type="text" name="nom" class="form-control" th:value="${labo?.nom}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Date de Création du Laboratoire</label>
                    <input type="date" name="dateCreation" class="form-control" th:value="${labo?.dateCreation}" required>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label fw-bold">Slogan / Devise</label>
                    <input type="text" name="slogan" class="form-control" th:value="${labo?.slogan}">
                </div>
            </div>
            <hr>
            <button type="submit" class="btn btn-success px-4"><i class="fa-solid fa-save me-2"></i>Enregistrer les modifications</button>
        </form>
    </div>
</div>
</body>
</html>
