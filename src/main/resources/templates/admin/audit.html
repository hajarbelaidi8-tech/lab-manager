<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Maintenance & Audit - LIAS Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50">
<!-- Jib l-menu (Sidebar + Topbar) -->
<div th:replace="~{layout/navbar :: menu}"></div>

<div class="main-content">
    <div class="container-fluid">
        <!-- HEADER D L-MAINTENANCE -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-slate-800 mb-1">
                    <i class="fa-solid fa-shield-halved text-primary me-2"></i>Journal de Maintenance
                </h3>
                <p class="text-muted small mb-0">Traçabilité complète des activités du système</p>
            </div>
            <div class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill border border-primary border-opacity-20">
                <i class="fa-solid fa-circle-check me-1"></i> Système Sécurisé
            </div>
        </div>

        <!-- TABLEAU D'AUDIT -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-slate-900 text-white">
                    <tr>
                        <th class="ps-4 py-3">📅 Date & Heure</th>
                        <th class="py-3">👤 Utilisateur</th>
                        <th class="py-3">⚡ Action</th>
                        <th class="py-3 pe-4">📝 Détails de l'opération</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white">
                    <tr th:each="log : ${logs}" class="border-bottom">
                        <td class="ps-4">
                            <span class="fw-bold text-dark" th:text="${#temporals.format(log.dateAction, 'dd/MM/yyyy')}"></span>
                            <br><small class="text-muted" th:text="${#temporals.format(log.dateAction, 'HH:mm:ss')}"></small>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                                    <i class="fa-solid fa-user-gear text-slate-400" style="font-size: 0.8rem;"></i>
                                </div>
                                <div>
                                    <span class="fw-bold text-slate-700" th:text="${log.utilisateur != null ? log.utilisateur.prenom + ' ' + log.utilisateur.nom : 'Système'}">Admin</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <!-- BADGES D'ACTION DYNAMIQUES ⭐ -->
                            <span class="badge rounded-pill px-3 py-2"
                                  th:classappend="${log.action.contains('DELETE') ? 'bg-danger bg-opacity-10 text-danger' :
                           (log.action.contains('ASSIGN') ? 'bg-success bg-opacity-10 text-success' :
                           (log.action.contains('APPLICATION') ? 'bg-warning bg-opacity-10 text-warning' :
                           'bg-primary bg-opacity-10 text-primary'))}"
                                  th:text="${log.action}">ACTION</span>
                        </td>
                        <td class="pe-4 text-secondary small" style="max-width: 400px; white-space: pre-wrap;" th:text="${log.details}">
                            Détails techniques de l'action...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- SI LE JOURNAL EST VIDE -->
            <div th:if="${#lists.isEmpty(logs)}" class="text-center py-5 bg-white">
                <i class="fa-solid fa-clipboard-list fa-3x text-slate-200 mb-3"></i>
                <h5 class="text-slate-400">Aucun log enregistré dans la base de données.</h5>
            </div>
        </div>

        <div class="mt-4 text-center">
            <p class="text-slate-400" style="font-size: 0.7rem;">&copy; 2026 LIAS Lab - Module de Maintenance Sécurisé</p>
        </div>
    </div>
</div>
</body>
</html>
